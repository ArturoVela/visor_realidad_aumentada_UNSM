# Reemplaza estos entity_id por los de los dispositivos registrados en Home Assistant.
- id: homelab_luz_movimiento
  alias: Encender luz cuando hay movimiento de noche
  triggers:
    - trigger: state
      entity_id: binary_sensor.movimiento_pasillo
      to: "on"
  conditions:
    - condition: sun
      after: sunset
      before: sunrise
  actions:
    - action: light.turn_on
      target:
        entity_id: light.pasillo
  mode: single

- id: homelab_ventilacion_humedad
  alias: Ajustar ventilación con histéresis
  triggers:
    - trigger: numeric_state
      entity_id: sensor.humedad_cuarto
      above: 65
      for:
        minutes: 5
      id: encender
    - trigger: numeric_state
      entity_id: sensor.humedad_cuarto
      below: 55
      for:
        minutes: 5
      id: apagar
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: encender
          sequence:
            - action: fan.turn_on
              target:
                entity_id: fan.cuarto
        - conditions:
            - condition: trigger
              id: apagar
          sequence:
            - action: fan.turn_off
              target:
                entity_id: fan.cuarto
  mode: single

- id: homelab_alerta_fuga
  alias: Aviso local de fuga de agua
  triggers:
    - trigger: state
      entity_id: binary_sensor.fuga_agua
      to: "on"
  actions:
    - action: persistent_notification.create
      data:
        title: Fuga de agua detectada
        message: Revisa el sensor de agua y su zona.
        notification_id: homelab_fuga
  mode: single
