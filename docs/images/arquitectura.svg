<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Nexus AR</title>
  <desc id="desc">RoomPlan, demo y archivos Packet Tracer convertidos a JSON alimentan la validación y distribución Swift. RealityKit muestra el laboratorio en 3D o AR; los datos se guardan localmente.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="51" fill="#172033" font-size="25" font-weight="700">Del espacio al laboratorio</text>
    <text x="40" y="80" fill="#475569" font-size="16">Procesamiento local · sin servidor ni cuenta obligatoria</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="40" y="115" width="270" height="72" rx="12"/>
      <rect x="40" y="207" width="270" height="72" rx="12"/>
      <rect x="40" y="299" width="270" height="90" rx="12"/>
      <rect x="400" y="170" width="330" height="180" rx="16" stroke="#1672da"/>
      <rect x="820" y="142" width="340" height="100" rx="12"/>
      <rect x="820" y="272" width="340" height="100" rx="12"/>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M310 151H355V212H400"/>
      <path d="M310 243H400"/>
      <path d="M310 344H355V292H400"/>
      <path d="M730 220H775V192H820"/>
      <path d="M730 302H775V322H820"/>
    </g>
    <g fill="#172033" font-size="19" font-weight="600">
      <text x="60" y="145">Cuarto escaneado</text>
      <text x="60" y="237">Sala de prueba</text>
      <text x="60" y="330">Packet Tracer .pkt</text>
      <text x="425" y="207">Núcleo Swift</text>
      <text x="845" y="178">RealityKit · 3D / AR</text>
      <text x="845" y="308">Persistencia JSON</text>
    </g>
    <g fill="#475569" font-size="16">
      <text x="60" y="170">RoomPlan → estructura en metros</text>
      <text x="60" y="262">Demo sintética de 192 m²</text>
      <text x="60" y="358">Exportador macOS / Python</text>
      <text x="60" y="379">→ .nexus.json</text>
      <text x="425" y="242">Validación de geometría y datos</text>
      <text x="425" y="272">Distribución de racks y puestos</text>
      <text x="425" y="302">Equipos, puertos, enlaces y VLAN</text>
      <text x="425" y="330" font-size="14">Datos descriptivos; sin motor de red</text>
      <text x="845" y="207">Cuarto: AR 1:1 · demo/importación: 1:10</text>
      <text x="845" y="229">Selección de hardware y conexiones</text>
      <text x="845" y="337">Capturas y última importación locales</text>
      <text x="845" y="359">Restauración del laboratorio en 3D</text>
    </g>
  </g>
</svg>
